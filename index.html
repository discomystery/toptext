<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Meme</title>
  <meta name="description" content="A fast, private image editor for memes and social posts.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ffd60a'/><text x='16' y='23' font-family='Impact,sans-serif' font-size='18' text-anchor='middle' fill='%23141414'>QM</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">QM</span><span class="brand-name">Quick Meme</span></div>
    <div class="top-actions">
      <button class="btn" id="btnOpen" title="Open an image (replaces the current one)">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Open</span>
      </button>
      <span class="divider"></span>
      <button class="btn icon" id="btnUndo" title="Undo (⌘Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="Redo (⇧⌘Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
      </button>
      <span class="divider"></span>
      <button class="btn" id="btnCopy" title="Copy image to clipboard (⇧⌘C)" disabled>
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>
      </button>
      <button class="btn primary" id="btnDownload" title="Download PNG (⌘S)" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Download</span>
      </button>
    </div>
  </header>

  <main class="workspace">
    <nav class="toolrail" id="toolrail" aria-label="Tools">
      <button class="tool" data-tool="text" title="Add a text box (T)">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span>Text</span>
      </button>
      <button class="tool" data-tool="meme" title="Add classic top &amp; bottom meme text (M)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="7.5" x2="17" y2="7.5"/><line x1="7" y1="16.5" x2="17" y2="16.5"/></svg><span>Meme</span>
      </button>
      <button class="tool" data-tool="caption" data-mode="caption" title="White caption bar above the image">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><line x1="7" y1="6" x2="13" y2="6"/></svg><span>Caption</span>
      </button>
      <button class="tool" data-tool="stickers" data-mode="stickers" title="Emoji &amp; stickers">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>Stickers</span>
      </button>
      <button class="tool" data-tool="arrow" title="Add an arrow">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg><span>Arrow</span>
      </button>
      <button class="tool" data-tool="rect" title="Add a box outline">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg><span>Box</span>
      </button>
      <button class="tool" data-tool="ellipse" title="Add a circle outline">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7.5"/></svg><span>Circle</span>
      </button>
      <button class="tool" data-tool="blur" title="Blur, pixelate or black out an area">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg><span>Blur</span>
      </button>
      <button class="tool" data-tool="overlay" title="Add another image as a layer">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add image</span>
      </button>
      <div class="rail-sep"></div>
      <button class="tool" data-tool="crop" data-mode="crop" title="Crop, resize to social sizes, rotate (C)">
        <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span>Crop</span>
      </button>
      <button class="tool" data-tool="image" data-mode="image" title="Adjust colors, remove background">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Adjust</span>
      </button>
      <button class="tool" data-tool="templates" data-mode="templates" title="Saved templates">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Templates</span>
      </button>
    </nav>

    <section class="stage" id="stage">
      <div class="empty" id="empty">
        <button class="dropzone" id="dropzone" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <strong>Drop an image here</strong>
          <span>or click to choose a file &middot; or paste with <kbd>⌘V</kbd></span>
        </button>
        <div class="blank-row">
          <span class="muted">Or start blank:</span>
          <button class="chip" data-blank="1080x1080">Square 1080</button>
          <button class="chip" data-blank="1080x1350">Portrait 4:5</button>
          <button class="chip" data-blank="1080x1920">Story 9:16</button>
          <button class="chip" data-blank="1920x1080">Wide 16:9</button>
        </div>
        <div class="empty-templates" id="emptyTemplates"></div>
      </div>
      <canvas id="canvas" hidden></canvas>
      <div class="busy" id="busy" hidden>
        <div class="busy-card">
          <div class="spinner"></div>
          <div id="busyText">Working…</div>
          <div class="progress"><div id="busyBar"></div></div>
        </div>
      </div>
      <div class="drop-overlay" id="dropOverlay" hidden><div>Drop to add image</div></div>
    </section>

    <aside class="sidebar">
      <div class="panel" id="panel"></div>
      <div class="layers" id="layersBox">
        <div class="layers-head"><span>Layers</span><span class="muted small">drag to reorder</span></div>
        <ul class="layer-list" id="layerList"></ul>
      </div>
    </aside>
  </main>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="overlayInput" accept="image/*" hidden>
  <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" hidden>
  <input type="file" id="templateInput" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
